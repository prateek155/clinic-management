spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: clinic-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
    username: ${DB_USERNAME:clinic}
    password: ${DB_PASSWORD:clinic_dev_only}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  clinic-bootstrap:
    enabled: ${BOOTSTRAP_CLINIC_ENABLED:false}
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    clinic-name: ${BOOTSTRAP_CLINIC_NAME:Careflow Clinic}
